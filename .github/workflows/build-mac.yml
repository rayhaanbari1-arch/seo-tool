name: Build macOS App

on:
  push:
    branches: [main, master]
    paths:
      - 'app.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'mac-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build .app and .dmg on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      # ── Download Playwright Chromium ──────────────────────────────────────
      - name: Download Playwright Chromium
        run: playwright install chromium

      - name: Copy Chromium into build folder
        run: |
          PW_PATH="$HOME/Library/Caches/ms-playwright"
          echo "Copying from: $PW_PATH"
          mkdir -p playwright-browsers
          cp -R "$PW_PATH/." playwright-browsers/
          # Ensure all binaries are executable
          find playwright-browsers -type f -name "Chromium" -exec chmod +x {} \;
          find playwright-browsers -type f -name "*.dylib" -exec chmod +x {} \;
          du -sh playwright-browsers

      # ── Write build version ───────────────────────────────────────────────
      - name: Write commit SHA into version.py
        run: |
          SHA=$(git rev-parse HEAD)
          echo "# Auto-generated by GitHub Actions" > mac-app/version.py
          echo "COMMIT_SHA = '$SHA'" >> mac-app/version.py
          echo "Version: $SHA"

      # ── Build .app ────────────────────────────────────────────────────────
      - name: Build .app with PyInstaller
        run: pyinstaller mac-app/SEO-Event-Tracker.spec --clean --noconfirm

      # ── Inject Chromium into the .app bundle ─────────────────────────────
      - name: Copy Chromium into .app bundle
        run: |
          BROWSERS_DEST="dist/SEO-Event-Tracker.app/Contents/Resources/browsers"
          mkdir -p "$BROWSERS_DEST"
          cp -R playwright-browsers/. "$BROWSERS_DEST/"
          # Restore execute permissions (cp can strip them)
          find "$BROWSERS_DEST" -type f -name "Chromium" -exec chmod +x {} \;
          find "$BROWSERS_DEST" -name "*.dylib" -exec chmod +x {} \;
          find "$BROWSERS_DEST" -name "*.so" -exec chmod +x {} \;
          echo "Bundle size:"
          du -sh "dist/SEO-Event-Tracker.app"

      # ── Ad-hoc sign to prevent "damaged" Gatekeeper error ───────────────
      - name: Ad-hoc code sign .app
        run: |
          codesign --deep --force --sign - --options runtime \
            "dist/SEO-Event-Tracker.app"
          codesign --verify --deep --strict "dist/SEO-Event-Tracker.app"

      # ── Package as .dmg ───────────────────────────────────────────────────
      - name: Get build metadata
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(echo $SHA | cut -c1-7)
          DATE=$(date +%Y-%m-%d)
          echo "sha=$SHA"             >> $GITHUB_OUTPUT
          echo "version=$DATE-$SHORT" >> $GITHUB_OUTPUT
          echo "tag=v$DATE-$SHORT-mac" >> $GITHUB_OUTPUT

      - name: Create .dmg
        run: |
          mkdir -p dmg-stage
          cp -R "dist/SEO-Event-Tracker.app" dmg-stage/
          # Add Applications symlink so users can drag-install
          ln -s /Applications dmg-stage/Applications
          hdiutil create \
            -volname "SEO Event Tracker" \
            -srcfolder dmg-stage \
            -ov -format UDZO \
            "SEO-Event-Tracker.dmg"
          echo "DMG size: $(du -sh SEO-Event-Tracker.dmg | cut -f1)"

      # ── Upload + release ──────────────────────────────────────────────────
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEO-Event-Tracker-macOS
          path: SEO-Event-Tracker.dmg
          retention-days: 30

      - name: Create GitHub Release
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          SHA="${{ steps.meta.outputs.sha }}"
          {
            echo "**Version:** $VERSION"
            echo "**Commit:** $SHA"
            echo ""
            echo "## Install"
            echo "1. Open the \`.dmg\` and drag **SEO Event Tracker** to Applications"
            echo "2. Double-click to launch"
            echo ""
            echo "## First launch — macOS security warning"
            echo "Because this app is not notarized, macOS will block it on first open."
            echo ""
            echo "**macOS 15 Sequoia:**"
            echo "1. Click Done on the warning"
            echo "2. Open **System Settings → Privacy & Security**"
            echo "3. Scroll down and click **Open Anyway** next to SEO Event Tracker"
            echo "4. Enter your password and relaunch"
            echo ""
            echo "**macOS 13 / 14:**"
            echo "Right-click the app → **Open** → **Open** to bypass (only needed once)."
          } > /tmp/release-notes.md
          gh release create "$TAG" \
            "SEO-Event-Tracker.dmg" \
            --title "SEO Event Tracker $VERSION (macOS)" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
