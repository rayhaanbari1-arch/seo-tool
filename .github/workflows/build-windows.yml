name: Build Windows App

on:
  push:
    branches: [main, master]
    paths:
      - 'app.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'windows-app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build installer on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      # ── Download Playwright Chromium ──────────────────────────────────────
      # This Chromium is bundled in the installer and used for both:
      #   1. The app UI window (--app mode, no browser chrome)
      #   2. Screenshot capture via Playwright API
      - name: Download Playwright Chromium
        run: playwright install chromium
        shell: pwsh

      - name: Copy Chromium into installer source folder
        run: |
          $pwPath = Join-Path $env:LOCALAPPDATA "ms-playwright"
          Write-Host "Copying from: $pwPath"
          New-Item -ItemType Directory -Force -Path "playwright-browsers" | Out-Null
          Copy-Item -Path "$pwPath\*" -Destination "playwright-browsers\" -Recurse -Force
          $size = [math]::Round((Get-ChildItem playwright-browsers -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB, 0)
          Write-Host "Chromium bundle size: $size MB"
        shell: pwsh

      # ── Write build version ───────────────────────────────────────────────
      - name: Write commit SHA into version.py
        run: |
          $sha = git rev-parse HEAD
          "# Auto-generated by GitHub Actions — do not edit manually." | Out-File windows-app/version.py -Encoding utf8
          "COMMIT_SHA = '$sha'" | Out-File windows-app/version.py -Append -Encoding utf8
          Write-Host "Version: $sha"
        shell: pwsh

      # ── Build .exe ────────────────────────────────────────────────────────
      - name: Build app .exe with PyInstaller
        run: pyinstaller windows-app/SEO-Event-Tracker.spec --clean --noconfirm
        shell: pwsh

      # ── Build installer ───────────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Get build metadata
        id: meta
        run: |
          $sha      = git rev-parse HEAD
          $shortSha = $sha.Substring(0, 7)
          $date     = Get-Date -Format "yyyy-MM-dd"
          $version  = "$date-$shortSha"
          $tag      = "v$version"
          echo "sha=$sha"         >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "tag=$tag"         >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer with Inno Setup
        run: |
          $version = "${{ steps.meta.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q `
            "/DAppVersion=$version" `
            "windows-app\installer.iss"
          $size = [math]::Round((Get-Item installer-dist\SEO-Event-Tracker-Setup.exe).Length / 1MB, 1)
          Write-Host "Installer size: $size MB"
        shell: pwsh

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: SEO-Event-Tracker-Setup
          path: installer-dist/SEO-Event-Tracker-Setup.exe
          retention-days: 30

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        run: |
          $tag     = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $sha     = "${{ steps.meta.outputs.sha }}"
          gh release create $tag `
            "installer-dist\SEO-Event-Tracker-Setup.exe" `
            --title "SEO Event Tracker $version" `
            --notes "**Version:** $version``n**Commit:** $sha``n``nDownload and run ``SEO-Event-Tracker-Setup.exe`` — no manual setup required."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
