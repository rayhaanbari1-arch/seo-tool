name: Build Windows App

on:
  push:
    branches: [main, master]
    paths:
      - 'app.py'
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'windows-app/**'
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build:
    name: Build .exe and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Write commit SHA into version.py
        run: |
          $sha = git rev-parse HEAD
          "# Auto-generated by GitHub Actions — do not edit manually." | Out-File -FilePath windows-app/version.py -Encoding utf8
          "COMMIT_SHA = '$sha'" | Out-File -FilePath windows-app/version.py -Append -Encoding utf8
        shell: pwsh

      - name: Build .exe
        run: pyinstaller windows-app/SEO-Event-Tracker.spec --clean --noconfirm

      - name: Get build info
        id: info
        run: |
          $sha      = git rev-parse HEAD
          $shortSha = $sha.Substring(0, 7)
          $date     = Get-Date -Format "yyyy-MM-dd"
          $tag      = "v$date-$shortSha"
          $size     = [math]::Round((Get-Item dist/SEO-Event-Tracker.exe).length / 1MB, 1)
          echo "sha=$sha"         >> $env:GITHUB_OUTPUT
          echo "short=$shortSha"  >> $env:GITHUB_OUTPUT
          echo "date=$date"       >> $env:GITHUB_OUTPUT
          echo "tag=$tag"         >> $env:GITHUB_OUTPUT
          echo "size=${size} MB"  >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create GitHub Release
        run: |
          gh release create "${{ steps.info.outputs.tag }}" `
            dist/SEO-Event-Tracker.exe `
            --title "SEO Event Tracker ${{ steps.info.outputs.date }}" `
            --notes "**Build:** ${{ steps.info.outputs.tag }}`n**Commit:** ${{ steps.info.outputs.sha }}`n**Size:** ${{ steps.info.outputs.size }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: SEO-Event-Tracker-Windows
          path: dist/SEO-Event-Tracker.exe
          retention-days: 30
